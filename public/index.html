<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatos e Gatos: Vivo ou Morto, És a Questão!</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #58a6ff; margin-bottom: 5px; }
    h3 { color: #8b949e; margin-top: 0; font-weight: normal; }
    #lobby {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 50px;
    }
    input {
      padding: 10px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: white;
      margin-right: 10px;
    }
    #game-area { display: none; }
    #status-bar {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 20px;
      font-weight: bold;
      color: #79c0ff;
    }
    .boards-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .board-box {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 15px;
    }
    .board-box.live { border-color: #2ea043; }
    .board-box.dead { border-color: #da3633; }
    .board-box.enemy { border-color: #d29922; }
    .board-title { font-size: 1.1rem; margin-bottom: 10px; font-weight: bold; }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 45px);
      grid-template-rows: repeat(5, 45px);
      gap: 4px;
    }
    .cell {
      width: 45px;
      height: 45px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      user-select: none;
    }
    .cell:hover { background: #30363d; }
    .cell.cat-live { background: #238636; }
    .cell.cat-dead { background: #da3633; }
    .cell.guess-live { background: #1f6feb; }
    .cell.guess-dead { background: #8957e5; }
    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
  </style>
</head>
<body>

  <h1>🐱 Gatos e Gatos: Vivo ou Morto 🐱</h1>
  <h3>Jogo Estratégico de Emaranhamento Quântico</h3>

  <!-- Tela de Lobby (Salas) -->
  <div id="lobby">
    <h2>Entrar ou Criar Sala</h2>
    <input type="text" id="room-code-input" placeholder="Digite o código da sala">
    <br><br>
    <button onclick="createRoom()">Criar Sala</button>
    <button onclick="joinRoom()">Entrar na Sala</button>
  </div>

  <!-- Área do Jogo -->
  <div id="game-area">
    <div id="status-bar">Aguardando...</div>

    <div class="boards-container">
      <!-- Seus Gatos -->
      <div class="board-box live">
        <div class="board-title" style="color: #3fb950;">Seu Gato Vivo (|Ψ⟩)</div>
        <div id="grid-live" class="grid"></div>
      </div>
      <div class="board-box dead">
        <div class="board-title" style="color: #f85149;">Seu Gato Morto (|Φ⟩)</div>
        <div id="grid-dead" class="grid"></div>
      </div>

      <!-- Tabuleiros de Ataque (Onde você clica para adivinhar os do inimigo) -->
      <div class="board-box enemy">
        <div class="board-title" style="color: #d29922;">Adivinhar Gato Vivo Inimigo</div>
        <div id="grid-enemy-live" class="grid"></div>
      </div>
      <div class="board-box enemy">
        <div class="board-title" style="color: #d29922;">Adivinhar Gato Morto Inimigo</div>
        <div id="grid-enemy-dead" class="grid"></div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-confirm" onclick="confirmSetup()">Confirmar Posições Iniciais</button>
      <button id="btn-shoot" onclick="submitObservation()" style="background: #bb8009; display:none;" disabled>🎯 Disparar Medição (Observar)</button>
    </div>
  </div>

  <script>
    const socket = io();
    const BOARD_SIZE = 5;

    let myPlayerNumber = null;
    let isMyTurn = false;
    let gameStage = 'SETUP';

    let myLiveCat = null;
    let myDeadCat = null;

    let guessLiveTarget = null;
    let guessDeadTarget = null;

    function createRoom() {
      const code = document.getElementById('room-code-input').value.trim();
      if (!code) { alert('Digite um código para a sala!'); return; }
      socket.emit('createRoom', code);
    }

    function joinRoom() {
      const code = document.getElementById('room-code-input').value.trim();
      if (!code) { alert('Digite o código da sala!'); return; }
      socket.emit('joinRoom', code);
    }

    socket.on('errorMsg', (msg) => alert(msg));

    socket.on('init', (data) => {
      myPlayerNumber = data.playerNumber;
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      setStatus(`Sala: ${data.roomCode} | Jogador ${myPlayerNumber}. Posicione seus gatos clicando nos seus tabuleiros.`);
      buildAllGrids();
    });

    function buildAllGrids() {
      buildGrid('grid-live', (x, y) => handleMyGridClick('live', x, y));
      buildGrid('grid-dead', (x, y) => handleMyGridClick('dead', x, y));
      buildGrid('grid-enemy-live', (x, y) => handleEnemyGridClick('live', x, y));
      buildGrid('grid-enemy-dead', (x, y) => handleEnemyGridClick('dead', x, y));
    }

    function buildGrid(containerId, callback) {
      const grid = document.getElementById(containerId);
      grid.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.x = c;
          cell.dataset.y = r;
          cell.onclick = () => callback(c, r);
          grid.appendChild(cell);
        }
      }
    }

    function handleMyGridClick(type, x, y) {
      if (gameStage === 'SETUP') {
        if (type === 'live') myLiveCat = { x, y };
        if (type === 'dead') myDeadCat = { x, y };
        renderMyBoards();
      } else if (gameStage === 'PLAYING' && isMyTurn && type === 'live') {
        // Movimento espelho
        const dx = x - myLiveCat.x;
        const dy = y - myLiveCat.y;
        const newDeadX = myDeadCat.x - dx;
        const newDeadY = myDeadCat.y - dy;

        if (newDeadX >= 0 && newDeadX < BOARD_SIZE && newDeadY >= 0 && newDeadY < BOARD_SIZE) {
          myLiveCat = { x, y };
          myDeadCat = { x: newDeadX, y: newDeadY };
          renderMyBoards();
          socket.emit('makeMove', { newLive: myLiveCat, newDead: myDeadCat });
          setStatus('Movimento realizado! Agora escolha onde atirar no tabuleiro inimigo e clique em "Disparar Medição".');
          document.getElementById('btn-shoot').style.display = 'inline-block';
          document.getElementById('btn-shoot').disabled = false;
        } else {
          alert('Movimento inválido! O Gato Morto sairia do tabuleiro.');
        }
      }
    }

    function handleEnemyGridClick(type, x, y) {
      if (gameStage !== 'PLAYING' || !isMyTurn) return;

      if (type === 'live') guessLiveTarget = { x, y };
      if (type === 'dead') guessDeadTarget = { x, y };

      renderEnemyGuesses();
    }

    function renderMyBoards() {
      const gridLive = document.getElementById('grid-live');
      const gridDead = document.getElementById('grid-dead');

      for(let i=0; i<25; i++) {
        gridLive.children[i].className = 'cell';
        gridLive.children[i].innerHTML = '';
        gridDead.children[i].className = 'cell';
        gridDead.children[i].innerHTML = '';
      }

      if (myLiveCat) {
        const idx = myLiveCat.y * BOARD_SIZE + myLiveCat.x;
        gridLive.children[idx].classList.add('cat-live');
        gridLive.children[idx].innerHTML = '🐱';
      }
      if (myDeadCat) {
        const idx = myDeadCat.y * BOARD_SIZE + myDeadCat.x;
        gridDead.children[idx].classList.add('cat-dead');
        gridDead.children[idx].innerHTML = '💀';
      }
    }

    function renderEnemyGuesses() {
      const gridELive = document.getElementById('grid-enemy-live');
      const gridEDead = document.getElementById('grid-enemy-dead');

      for(let i=0; i<25; i++) {
        gridELive.children[i].className = 'cell';
        gridELive.children[i].innerHTML = '';
        gridEDead.children[i].className = 'cell';
        gridEDead.children[i].innerHTML = '';
      }

      if (guessLiveTarget) {
        const idx = guessLiveTarget.y * BOARD_SIZE + guessLiveTarget.x;
        gridELive.children[idx].classList.add('guess-live');
        gridELive.children[idx].innerHTML = '🎯';
      }
      if (guessDeadTarget) {
        const idx = guessDeadTarget.y * BOARD_SIZE + guessDeadTarget.x;
        gridEDead.children[idx].classList.add('guess-dead');
        gridEDead.children[idx].innerHTML = '🎯';
      }
    }

    function confirmSetup() {
      if (!myLiveCat || !myDeadCat) {
        alert('Posicione o seu Gato Vivo e o seu Gato Morto antes de continuar!');
        return;
      }
      socket.emit('setInitialPositions', { live: myLiveCat, dead: myDeadCat });
      document.getElementById('btn-confirm').disabled = true;
      setStatus('Posições confirmadas! Aguardando o oponente...');
    }

    function submitObservation() {
      if (!guessLiveTarget || !guessDeadTarget) {
        alert('Selecione uma casa nos dois tabuleiros inimigos para realizar a medição!');
        return;
      }
      socket.emit('observe', { targetLive: guessLiveTarget, targetDead: guessDeadTarget });
      document.getElementById('btn-shoot').style.display = 'none';
      guessLiveTarget = null;
      guessDeadTarget = null;
      renderEnemyGuesses();
    }

    function setStatus(msg) {
      document.getElementById('status-bar').innerText = msg;
    }

    socket.on('status', (msg) => setStatus(msg));

    socket.on('gameStart', (data) => {
      gameStage = 'PLAYING';
      document.getElementById('btn-confirm').style.display = 'none';
      isMyTurn = (data.activeTurn === socket.id);
      
      if (isMyTurn) {
        setStatus('Sua vez! Mova seu Gato Vivo em seu tabuleiro e depois selecione o alvo no tabuleiro inimigo.');
      } else {
        setStatus("Vez do oponente...");
      }
    });

    socket.on('updateBoard', (data) => {
      isMyTurn = (data.nextTurn === socket.id);
      if (isMyTurn) {
        setStatus('Sua vez de jogar!');
      } else {
        setStatus('O oponente jogou. Aguardando...');
      }
    });

    socket.on('observeResult', (data) => {
      alert(`Resultado da Medição Quântica:\nGato Vivo atingido? ${data.hitLive ? 'SIM 🎯' : 'NÃO ❌'}\nGato Morto atingido? ${data.hitDead ? 'SIM 🎯' : 'NÃO ❌'}`);
    });

    socket.on('gameOver', (data) => {
      if (data.winner === myPlayerNumber) {
        alert('🎉 VITÓRIA QUÂNTICA! Você colapsou a função de onda e encontrou os dois gatos do oponente!');
        setStatus('Você Venceu!');
      } else {
        alert('💀 DERROTA! O oponente descobriu os seus gatos!');
        setStatus('Você Perdeu!');
      }
      gameStage = 'ENDED';
    });

    socket.on('playerLeft', (msg) => {
      alert(msg);
      location.reload();
    });
  </script>
</body>
</html>
