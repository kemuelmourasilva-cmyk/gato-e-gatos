<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatos e Gatos: Vivo ou Morto, És a Questão!</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #58a6ff; margin-bottom: 5px; }
    h3 { color: #8b949e; margin-top: 0; font-weight: normal; }
    #status-bar {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 20px;
      font-weight: bold;
      color: #79c0ff;
    }
    .boards-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .board-box {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 15px;
    }
    .board-box.live { border-color: #2ea043; }
    .board-box.dead { border-color: #da3633; }
    .board-title { font-size: 1.2rem; margin-bottom: 10px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 50px);
      grid-template-rows: repeat(5, 50px);
      gap: 5px;
    }
    .cell {
      width: 50px;
      height: 50px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      user-select: none;
    }
    .cell:hover { background: #30363d; }
    .cell.cat-live { background: #238636; }
    .cell.cat-dead { background: #da3633; }
    .cell.selected { border: 2px solid #f0883e; }
    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { background: #484f58; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #2ea043; }
  </style>
</head>
<body>

  <h1>🐱 Gatos e Gatos: Vivo ou Morto 🐱</h1>
  <h3>Jogo Estratégico de Emaranhamento Quântico</h3>

  <div id="status-bar">Conectando ao servidor...</div>

  <div class="boards-container">
    <!-- Tabuleiro Gato Vivo -->
    <div class="board-box live">
      <div class="board-title" style="color: #3fb950;">🐱 Tabuleiro Vivo ( |Ψ⟩ )</div>
      <div id="grid-live" class="grid"></div>
    </div>

    <!-- Tabuleiro Gato Morto -->
    <div class="board-box dead">
      <div class="board-title" style="color: #f85149;">💀 Tabuleiro Morto ( |Φ⟩ )</div>
      <div id="grid-dead" class="grid"></div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-confirm" onclick="confirmSetup()">Confirmar Posições Iniciais</button>
    <button id="btn-observe" onclick="observeOpponent()" disabled>⚛️ Observar Oponente (Medição)</button>
  </div>

  <script>
    const socket = io();
    const BOARD_SIZE = 5;

    let myPlayerNumber = null;
    let isMyTurn = false;
    let gameStage = 'SETUP'; // SETUP, PLAYING

    let myLiveCat = null;  // {x, y}
    let myDeadCat = null;  // {x, y}

    let targetLiveGuess = null;
    let targetDeadGuess = null;

    // Renderiza os dois tabuleiros na tela
    function createGrids() {
      const gridLive = document.getElementById('grid-live');
      const gridDead = document.getElementById('grid-dead');

      gridLive.innerHTML = '';
      gridDead.innerHTML = '';

      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          // Células Vivo
          const cellL = document.createElement('div');
          cellL.className = 'cell';
          cellL.dataset.x = c;
          cellL.dataset.y = r;
          cellL.onclick = () => handleCellClick('live', c, r);
          gridLive.appendChild(cellL);

          // Células Morto
          const cellD = document.createElement('div');
          cellD.className = 'cell';
          cellD.dataset.x = c;
          cellD.dataset.y = r;
          cellD.onclick = () => handleCellClick('dead', c, r);
          gridDead.appendChild(cellD);
        }
      }
    }

    function handleCellClick(type, x, y) {
      if (gameStage === 'SETUP') {
        if (type === 'live') myLiveCat = { x, y };
        if (type === 'dead') myDeadCat = { x, y };
        renderBoard();
      } else if (gameStage === 'PLAYING' && isMyTurn) {
        // Movimento Espelho: Mover no Vivo reflete invertido no Morto
        if (type === 'live' && myLiveCat) {
          const dx = x - myLiveCat.x;
          const dy = y - myLiveCat.y;

          const newDeadX = myDeadCat.x - dx;
          const newDeadY = myDeadCat.y - dy;

          // Verifica se o movimento invertido é válido dentro do tabuleiro
          if (newDeadX >= 0 && newDeadX < BOARD_SIZE && newDeadY >= 0 && newDeadY < BOARD_SIZE) {
            myLiveCat = { x, y };
            myDeadCat = { x: newDeadX, y: newDeadY };
            renderBoard();

            // Envia movimento ao servidor
            socket.emit('makeMove', { newLive: myLiveCat, newDead: myDeadCat });
            setStatus('Movimento realizado! Aguardando oponente...');
            isMyTurn = false;
          } else {
            alert('Movimento inválido! O movimento espelho do Gato Morto sairia do tabuleiro.');
          }
        }
      }
    }

    function renderBoard() {
      document.querySelectorAll('.cell').forEach(c => {
        c.className = 'cell';
        c.innerHTML = '';
      });

      const gridLive = document.getElementById('grid-live');
      const gridDead = document.getElementById('grid-dead');

      if (myLiveCat) {
        const idx = myLiveCat.y * BOARD_SIZE + myLiveCat.x;
        gridLive.children[idx].classList.add('cat-live');
        gridLive.children[idx].innerHTML = '🐱';
      }

      if (myDeadCat) {
        const idx = myDeadCat.y * BOARD_SIZE + myDeadCat.x;
        gridDead.children[idx].classList.add('cat-dead');
        gridDead.children[idx].innerHTML = '💀';
      }
    }

    function confirmSetup() {
      if (!myLiveCat || !myDeadCat) {
        alert('Escolha uma posição para o Gato Vivo e uma para o Gato Morto!');
        return;
      }
      socket.emit('setInitialPositions', { live: myLiveCat, dead: myDeadCat });
      document.getElementById('btn-confirm').disabled = true;
      setStatus('Posições salvas. Aguardando oponente...');
    }

    function observeOpponent() {
      if (!isMyTurn) return;
      
      const lx = prompt("Adivinhe X do Gato Vivo do oponente (0 a 4):");
      const ly = prompt("Adivinhe Y do Gato Vivo do oponente (0 a 4):");
      const dx = prompt("Adivinhe X do Gato Morto do oponente (0 a 4):");
      const dy = prompt("Adivinhe Y do Gato Morto do oponente (0 a 4):");

      if (lx !== null && ly !== null && dx !== null && dy !== null) {
        socket.emit('observe', {
          targetLive: { x: parseInt(lx), y: parseInt(ly) },
          targetDead: { x: parseInt(dx), y: parseInt(dy) }
        });
      }
    }

    function setStatus(msg) {
      document.getElementById('status-bar').innerText = msg;
    }

    // --- EVENTOS DO SOCKET.IO ---

    socket.on('init', (data) => {
      myPlayerNumber = data.playerNumber;
      setStatus(`Você é o Jogador ${myPlayerNumber}. Selecione as posições iniciais dos dois gatos.`);
      createGrids();
    });

    socket.on('status', (msg) => setStatus(msg));

    socket.on('gameStart', (data) => {
      gameStage = 'PLAYING';
      document.getElementById('btn-confirm').style.display = 'none';
      isMyTurn = (data.activeTurn === socket.id);
      
      if (isMyTurn) {
        setStatus('Sua vez! Clique no Tabuleiro Vivo para mover (seu Gato Morto fará o movimento espelho).');
        document.getElementById('btn-observe').disabled = false;
      } else {
        setStatus('Vez do oponente...');
        document.getElementById('btn-observe').disabled = true;
      }
    });

    socket.on('updateBoard', (data) => {
      isMyTurn = (data.nextTurn === socket.id);
      if (isMyTurn) {
        setStatus('Sua vez de jogar!');
        document.getElementById('btn-observe').disabled = false;
      } else {
        setStatus('O oponente jogou. Aguardando a vez dele...');
        document.getElementById('btn-observe').disabled = true;
      }
    });

    socket.on('observeResult', (data) => {
      alert(`Resultado da Medição:\nGato Vivo atingido? ${data.hitLive ? 'SIM' : 'NÃO'}\nGato Morto atingido? ${data.hitDead ? 'SIM' : 'NÃO'}`);
    });

    socket.on('gameOver', (data) => {
      if (data.winner === myPlayerNumber) {
        alert('🎉 VITÓRIA QUÂNTICA! Você colapsou a função de onda do oponente e descobriu a posição exata dos dois gatos!');
        setStatus('Você Venceu!');
      } else {
        alert('💀 DERROTA! Seu oponente descobriu a posição exata dos seus dois gatos!');
        setStatus('Você Perdeu!');
      }
      gameStage = 'ENDED';
    });

    socket.on('playerLeft', (msg) => {
      alert(msg);
      location.reload();
    });
  </script>
</body>
</html>
