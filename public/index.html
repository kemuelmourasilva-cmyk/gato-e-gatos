<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatos e Gatos: Vivo ou Morto, És a Questão!</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117; color: #c9d1d9; text-align: center; margin: 0; padding: 20px;
    }
    h1 { color: #58a6ff; margin-bottom: 5px; }
    h3 { color: #8b949e; margin-top: 0; font-weight: normal; }
    #lobby {
      background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 12px; display: inline-block; margin-top: 50px;
    }
    input { padding: 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; margin-right: 10px; }
    #game-area { display: none; }
    #status-bar {
      background: #161b22; border: 1px solid #30363d; padding: 12px;
      border-radius: 8px; display: inline-block; margin-bottom: 15px; font-weight: bold; color: #79c0ff;
    }
    .quantum-panel {
      background: #1f242c; border: 2px dashed #8957e5; border-radius: 10px;
      padding: 15px; max-width: 500px; margin: 0 auto 20px auto; display: none;
    }
    .card-box {
      background: #161b22; border: 1px solid #8957e5; border-radius: 8px;
      padding: 10px; margin-top: 10px; color: #d2a8ff;
    }
    .boards-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
    .board-box { background: #161b22; border: 2px solid #30363d; border-radius: 12px; padding: 12px; }
    .board-box.live { border-color: #2ea043; }
    .board-box.dead { border-color: #da3633; }
    .board-box.enemy { border-color: #d29922; opacity: 0.5; pointer-events: none; } /* Bloqueado inicialmente */
    .board-box.enemy.active { opacity: 1; pointer-events: auto; }
    .board-title { font-size: 1rem; margin-bottom: 8px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(5, 40px); grid-template-rows: repeat(5, 40px); gap: 3px; }
    .cell {
      width: 40px; height: 40px; background: #21262d; border: 1px solid #30363d;
      border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; user-select: none;
    }
    .cell:hover { background: #30363d; }
    .cell.cat-live { background: #238636; }
    .cell.cat-dead { background: #da3633; }
    .cell.guess-live { background: #1f6feb; }
    .cell.guess-dead { background: #8957e5; }
    .controls { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
    button { background: #238636; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 6px; cursor: pointer; }
    button:hover { background: #2ea043; }
    button:disabled { background: #30363d; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>🐱 Gatos e Gatos: Vivo ou Morto 🐱</h1>
  <h3>Mecânica Probabilística & Cartas de Ação Quântica</h3>

  <div id="lobby">
    <h2>Entrar ou Criar Sala</h2>
    <input type="text" id="room-code-input" placeholder="Código da Sala">
    <br><br>
    <button onclick="createRoom()">Criar Sala</button>
    <button onclick="joinRoom()">Entrar na Sala</button>
  </div>

  <div id="game-area">
    <div id="status-bar">Aguardando...</div>

    <div id="quantum-panel" class="quantum-panel">
      <h3>⚛️ Turno Probabilístico ⚛️</h3>
      <button id="btn-dice" onclick="rollDice()">🎲 Rolar Dado Quântico</button>
      <div id="card-display" style="display:none;">
        <div id="card-content" class="card-box"></div>
      </div>
    </div>

    <div class="boards-container">
      <div class="board-box live">
        <div class="board-title" style="color: #3fb950;">Seu Gato Vivo (|Ψ⟩)</div>
        <div id="grid-live" class="grid"></div>
      </div>
      <div class="board-box dead">
        <div class="board-title" style="color: #f85149;">Seu Gato Morto (|Φ⟩)</div>
        <div id="grid-dead" class="grid"></div>
      </div>
      <!-- Tabuleiros de ataque inicialmente bloqueados até o posicionamento e jogada -->
      <div id="box-enemy-live" class="board-box enemy">
        <div class="board-title" style="color: #d29922;">Alvo: Vivo Inimigo</div>
        <div id="grid-enemy-live" class="grid"></div>
      </div>
      <div id="box-enemy-dead" class="board-box enemy">
        <div class="board-title" style="color: #d29922;">Alvo: Morto Inimigo</div>
        <div id="grid-enemy-dead" class="grid"></div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-confirm" onclick="confirmSetup()">Confirmar Posições Iniciais</button>
      <button id="btn-shoot" onclick="submitObservation()" style="background: #bb8009; display:none;" disabled>🎯 Disparar Medição</button>
    </div>
  </div>

  <script>
    const socket = io();
    const BOARD_SIZE = 5;

    let myPlayerNumber = null;
    let isMyTurn = false;
    let gameStage = 'SETUP';
    let hasRolledDice = false;

    let myLiveCat = null;
    let myDeadCat = null;
    let guessLiveTarget = null;
    let guessDeadTarget = null;

    function createRoom() {
      const code = document.getElementById('room-code-input').value.trim();
      if (!code) { alert('Digite o código!'); return; }
      socket.emit('createRoom', code);
    }

    function joinRoom() {
      const code = document.getElementById('room-code-input').value.trim();
      if (!code) { alert('Digite o código!'); return; }
      socket.emit('joinRoom', code);
    }

    socket.on('errorMsg', (m) => alert(m));
    socket.on('init', (d) => {
      myPlayerNumber = d.playerNumber;
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      setStatus(`Sala conectada! Jogador ${myPlayerNumber}. Posicione seus gatos.`);
      buildAllGrids();
    });

    function buildAllGrids() {
      buildGrid('grid-live', (x, y) => handleMyGridClick('live', x, y));
      buildGrid('grid-dead', (x, y) => handleMyGridClick('dead', x, y));
      buildGrid('grid-enemy-live', (x, y) => handleEnemyGridClick('live', x, y));
      buildGrid('grid-enemy-dead', (x, y) => handleEnemyGridClick('dead', x, y));
    }

    function buildGrid(id, cb) {
      const g = document.getElementById(id);
      g.innerHTML = '';
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.onclick = () => cb(c, r);
          g.appendChild(cell);
        }
      }
    }

    function handleMyGridClick(type, x, y) {
      if (gameStage === 'SETUP') {
        if (type === 'live') myLiveCat = { x, y };
        if (type === 'dead') myDeadCat = { x, y };
        renderMyBoards();
      } else if (gameStage === 'PLAYING' && isMyTurn && hasRolledDice && type === 'live') {
        const dx = x - myLiveCat.x;
        const dy = y - myLiveCat.y;
        const newDeadX = myDeadCat.x - dx;
        const newDeadY = myDeadCat.y - dy;

        if (newDeadX >= 0 && newDeadX < BOARD_SIZE && newDeadY >= 0 && newDeadY < BOARD_SIZE) {
          myLiveCat = { x, y };
          myDeadCat = { x: newDeadX, y: newDeadY };
          renderMyBoards();
          socket.emit('makeMove', { newLive: myLiveCat, newDead: myDeadCat });
          
          // Libera tabuleiros inimigos para ataque após o movimento
          document.getElementById('box-enemy-live').classList.add('active');
          document.getElementById('box-enemy-dead').classList.add('active');
          
          setStatus('Movimento realizado! Selecione os alvos no tabuleiro inimigo e clique em Disparar Medição.');
          document.getElementById('btn-shoot').style.display = 'inline-block';
          document.getElementById('btn-shoot').disabled = false;
          document.getElementById('quantum-panel').style.display = 'none';
        } else {
          alert('Movimento espelho inválido fora do tabuleiro!');
        }
      } else if (isMyTurn && !hasRolledDice) {
        alert('Role o Dado Quântico primeiro!');
      }
    }

    function handleEnemyGridClick(type, x, y) {
      if (gameStage !== 'PLAYING' || !isMyTurn) return;
      if (type === 'live') guessLiveTarget = { x, y };
      if (type === 'dead') guessDeadTarget = { x, y };
      renderEnemyGuesses();
    }

    function rollDice() {
      socket.emit('rollQuantumDice');
      document.getElementById('btn-dice').disabled = true;
    }

    socket.on('diceResult', (data) => {
      hasRolledDice = true;
      document.getElementById('card-display').style.display = 'block';
      document.getElementById('card-content').innerHTML = `<strong>🎲 Dado: ${data.diceRoll}</strong><br><strong>Carta: ${data.card.name}</strong><br>${data.card.desc}`;
      setStatus(`Carta ativa! Mova seu gato no tabuleiro.`);
    });

    function renderMyBoards() {
      const gl = document.getElementById('grid-live');
      const gd = document.getElementById('grid-dead');
      for(let i=0; i<25; i++) {
        gl.children[i].className = 'cell'; gl.children[i].innerHTML = '';
        gd.children[i].className = 'cell'; gd.children[i].innerHTML = '';
      }
      if (myLiveCat) { gl.children[myLiveCat.y * BOARD_SIZE + myLiveCat.x].className = 'cell cat-live'; gl.children[myLiveCat.y * BOARD_SIZE + myLiveCat.x].innerHTML = '🐱'; }
      if (myDeadCat) { gd.children[myDeadCat.y * BOARD_SIZE + myDeadCat.x].className = 'cell cat-dead'; gd.children[myDeadCat.y * BOARD_SIZE + myDeadCat.x].innerHTML = '💀'; }
    }

    function renderEnemyGuesses() {
      const gel = document.getElementById('grid-enemy-live');
      const ged = document.getElementById('grid-enemy-dead');
      for(let i=0; i<25; i++) {
        gel.children[i].className = 'cell'; gel.children[i].innerHTML = '';
        ged.children[i].className = 'cell'; ged.children[i].innerHTML = '';
      }
      if (guessLiveTarget) { gel.children[guessLiveTarget.y * BOARD_SIZE + guessLiveTarget.x].className = 'cell guess-live'; gel.children[guessLiveTarget.y * BOARD_SIZE + guessLiveTarget.x].innerHTML = '🎯'; }
      if (guessDeadTarget) { ged.children[guessDeadTarget.y * BOARD_SIZE + guessDeadTarget.x].className = 'cell guess-dead'; ged.children[guessDeadTarget.y * BOARD_SIZE + guessDeadTarget.x].innerHTML = '🎯'; }
    }

    function confirmSetup() {
      if (!myLiveCat || !myDeadCat) { alert('Posicione o Gato Vivo e o Gato Morto!'); return; }
      socket.emit('setInitialPositions', { live: myLiveCat, dead: myDeadCat });
      document.getElementById('btn-confirm').disabled = true;
      setStatus('Posições confirmadas. Aguardando o oponente posicionar...');
    }

    function submitObservation() {
      if (!guessLiveTarget || !guessDeadTarget) { alert('Selecione os alvos nos tabuleiros inimigos!'); return; }
      socket.emit('observe', { targetLive: guessLiveTarget, targetDead: guessDeadTarget });
      document.getElementById('btn-shoot').style.display = 'none';
      
      // Bloqueia novamente os tabuleiros inimigos após o tiro
      document.getElementById('box-enemy-live').classList.remove('active');
      document.getElementById('box-enemy-dead').classList.remove('active');
      
      guessLiveTarget = null; guessDeadTarget = null;
      renderEnemyGuesses();
    }

    function setStatus(msg) { document.getElementById('status-bar').innerText = msg; }
    socket.on('status', (m) => setStatus(m));

    socket.on('gameStart', (d) => {
      gameStage = 'PLAYING';
      document.getElementById('btn-confirm').style.display = 'none';
      isMyTurn = (d.activeTurn === socket.id);
      hasRolledDice = false;
      if (isMyTurn) {
        setStatus('Partida Iniciada! Seu turno: Role o Dado Quântico.');
        document.getElementById('quantum-panel').style.display = 'block';
        document.getElementById('btn-dice').disabled = false;
        document.getElementById('card-display').style.display = 'none';
      } else {
        setStatus("Partida Iniciada! Vez do oponente...");
        document.getElementById('quantum-panel').style.display = 'none';
      }
    });

    socket.on('updateBoard', (d) => {
      isMyTurn = (d.nextTurn === socket.id);
      hasRolledDice = false;
      if (isMyTurn) {
        setStatus('Sua vez! Role o Dado Quântico.');
        document.getElementById('quantum-panel').style.display = 'block';
        document.getElementById('btn-dice').disabled = false;
        document.getElementById('card-display').style.display = 'none';
      } else {
        setStatus('O oponente jogou. Aguardando...');
        document.getElementById('quantum-panel').style.display = 'none';
      }
    });

    socket.on('observeResult', (d) => {
      alert(`Resultado da Medição:\nVivo atingido? ${d.hitLive ? 'SIM 🎯' : 'NÃO ❌'}\nMorto atingido? ${d.hitDead ? 'SIM 🎯' : 'NÃO ❌'}`);
    });

    socket.on('gameOver', (d) => {
      if (d.winner === myPlayerNumber) alert('🎉 VITÓRIA! Você encontrou os gatos do oponente.');
      else alert('💀 DERROTA! O oponente colapsou seus gatos.');
      gameStage = 'ENDED';
    });

    socket.on('playerLeft', (m) => { alert(m); location.reload(); });
  </script>
</body>
</html>
